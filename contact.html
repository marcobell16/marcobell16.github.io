<div class="grid"><div class="col"><p>Use the form to inquire about anything, or just to say hi.</p>
<form class="form" method="POST" action="https://formsubmit.co/ajax/marcobell@gmail.com">

  <label><span>Message</span><textarea name="message" rows="6" required></textarea></label>
  <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button type="submit">Send message</button>
  <p class="status" role="status" aria-live="polite"></p>
